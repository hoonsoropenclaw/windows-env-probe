name: probe
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: probe
        run: |
          python -c "import platform,sys,os,pathlib;print(\"platform\",platform.platform());print(\"py\",sys.version);print(\"fsenc\",sys.getfilesystemencoding())"
          python -c "print(\"cp950 ok:\", \"繁體中文測試\".encode(\"cp950\"))"
          python -c "import os,tempfile,pathlib;d=pathlib.Path(tempfile.mkdtemp());f=d/\"a.txt\";f.write_text(\"x\",encoding=\"utf-8\");os.replace(f,d/\"b.txt\");print(\"os.replace OK\", (d/\"b.txt\").exists())"

name: probe3
on:
  push:
    branches: [main]
jobs:
  probe3:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install openpyxl
        shell: pwsh
        run: python -m pip install --quiet openpyxl
      - name: run probe3
        shell: pwsh
        run: python probe3.py

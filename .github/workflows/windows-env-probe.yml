name: windows-env-probe
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps
        shell: pwsh
        run: python -m pip install --quiet openpyxl pandas pywin32
      - name: env probe (codec + excel + path + office)
        shell: pwsh
        run: python probe_env.py

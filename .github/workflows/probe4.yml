name: probe4
on:
  push:
    branches: [main]
jobs:
  probe4:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps
        shell: pwsh
        run: python -m pip install --quiet openpyxl pandas pywin32
      - name: run probe4
        shell: pwsh
        run: python probe4.py
